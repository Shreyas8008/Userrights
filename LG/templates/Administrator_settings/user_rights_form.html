<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Rights</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
            margin-top: 15px;
        }

        h2 {
            font-size: 14px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .add-button {
            padding: 8px 12px;
            background: linear-gradient(45deg, #005792, #008ea1);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 10px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

            .add-button:hover {
                background: linear-gradient(45deg, #00416a, #00737a);
            }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9px;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 3px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #005792;
            color: white;
            font-size: 10px;
            font-weight: 100;
        }

        tr:nth-child(even) {
            background-color: #e9f3f8;
        }

        tr:hover {
            background-color: #d0e7f2;
        }

        select {
            font-size: 10px;
            padding: 3px;
            margin-bottom: 10px;
        }

        /* Popup styles */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
        }

            .popup button {
                padding: 3px 6px;
                border: none;
                border-radius: 5px;
                font-size: 14px;
                cursor: pointer;
                transition: 0.3s;
                margin: 5px;
            }

        .btn-yes {
            background: linear-gradient(45deg, #87CEFA, #00008B);
            color: white;
        }

            .btn-yes:hover {
                background: linear-gradient(45deg, #5ca5d6, #000070);
            }

        .btn-no {
            background: linear-gradient(45deg, #ff1493, #6a0dad);
            color: white;
        }

            .btn-no:hover {
                background: linear-gradient(45deg, #e60073, #5c0aa5);
            }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h2>User Rights Management</h2>
        </div>
        <form method="POST" id="rightsForm">
            {% csrf_token %}
            <label for="user">Select User:</label>
            <select name="user" id="user" required>
                <option value="" disabled selected>Select User</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.name }}</option>
                {% endfor %}
            </select>

            <table>
                <thead>
                    <tr>
                        <th>SL No</th>
                        <th>Form Name</th>
                        <th>Read</th>
                        <th>Write</th>
                        <th>Modify</th>
                        <th>Delete</th>
                        <th>All</th>
                    </tr>
                </thead>
                <tbody>
                    {% for form in forms_data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ form }}</td>
                        <td><input type="checkbox" name="{{ form|lower|cut:' ' }}_view"></td>
                        <td><input type="checkbox" name="{{ form|lower|cut:' ' }}_add"></td>
                        <td><input type="checkbox" name="{{ form|lower|cut:' ' }}_edit"></td>
                        <td><input type="checkbox" name="{{ form|lower|cut:' ' }}_delete"></td>
                        <td><input type="checkbox" name="{{ form|lower|cut:' ' }}_all"></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <br>
            <button type="button" class="add-button" onclick="confirmSave()">Save Permissions</button>
        </form>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="confirmPopup">
        <p>Are you sure you want to assign these permissions?</p>
        <button class="btn-yes" onclick="submitForm()">Yes</button>
        <button class="btn-no" onclick="closePopup()">No</button>
    </div>

    <script>
        function confirmSave() {
            document.getElementById("overlay").style.display = "block";
            document.getElementById("confirmPopup").style.display = "block";
        }

        function closePopup() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("confirmPopup").style.display = "none";
        }

        function submitForm() {
            document.getElementById("rightsForm").submit();
        }
    </script>
</body>
</html>
